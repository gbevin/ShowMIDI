name: Release

# Builds the release artifacts for all three platforms. Windows binaries and
# its installer are signed through SignPath, in two round trips because the
# installer is built from the signed binaries. macOS is signed and notarized by
# Scripts/build-macos.sh with Apple's own tooling. Linux is unsigned.
#
# Repository secrets:
#   VST2_SDK_TOKEN         read access to the private VST2 SDK submodule
#   SIGNPATH_API_TOKEN     a SignPath CI user that submits to the policy
#   MACOS_CERTIFICATE      base64 .p12 with the Developer ID Application and
#                          Installer identities
#   MACOS_CERTIFICATE_PWD  that .p12's export password
#   NOTARY_KEY             base64 App Store Connect API key (.p8)
#   NOTARY_KEY_ID          that key's Key ID
#   NOTARY_ISSUER_ID       the App Store Connect Issuer ID
#
# Manually triggered for now: it uploads artifacts and drafts no release.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example 1.0.2
        required: true
      signing-policy:
        description: SignPath signing policy for the Windows artifacts
        required: true
        default: test-signing
        type: choice
        options: [ test-signing, release-signing ]
      platforms:
        description: Which platforms to build
        required: true
        default: all
        type: choice
        options: [ all, windows, macos, linux ]

permissions:
  contents: read
  # the SignPath action reads the uploaded artifact back out of the run
  actions: read

env:
  SIGNPATH_ORGANIZATION_ID: ae635b39-b945-488a-b9d1-4836c69b8b7e
  SIGNPATH_PROJECT_SLUG: ShowMIDI

jobs:
  windows:
    name: Windows package
    if: inputs.platforms == 'all' || inputs.platforms == 'windows'
    runs-on: windows-latest
    env:
      BUILD_DIR: Builds\VisualStudio2022\x64
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # the submodules are fetched separately below, so that the token for
          # the private VST2 SDK never needs access to this repository too
          submodules: false
          persist-credentials: false

      - name: Check out submodules
        shell: bash
        env:
          VST2_SDK_TOKEN: ${{ secrets.VST2_SDK_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${VST2_SDK_TOKEN}@github.com/".insteadOf "https://github.com/"
          git submodule update --init --recursive

      - uses: microsoft/setup-msbuild@v2
        with:
          # the LV2 manifest helper only runs under the 64-bit toolchain
          msbuild-architecture: x64

      - name: Build
        # the generated projects carry no references, so the shared code and the
        # manifest helpers have to come first, and the VST3 helper is 32-bit
        shell: pwsh
        run: |
          $projects = @(
            @{ name = "SharedCode";         platform = "x64"   },
            @{ name = "StandalonePlugin";   platform = "x64"   },
            @{ name = "VST";                platform = "x64"   },
            @{ name = "VST3ManifestHelper"; platform = "Win32" },
            @{ name = "VST3";               platform = "x64"   },
            @{ name = "LV2ManifestHelper";  platform = "x64"   },
            @{ name = "LV2Plugin";          platform = "x64"   }
          )
          foreach ($project in $projects) {
            msbuild "Builds\VisualStudio2022\ShowMIDI_$($project.name).vcxproj" /m /p:Configuration=Release /p:Platform=$($project.platform) /p:PreferredToolArchitecture=x64
            if ($LASTEXITCODE -ne 0) { throw "$($project.name) did not build" }
          }

      - name: Build CLAP
        env:
          PATH_TO_JUCE: ${{ github.workspace }}\JUCE
        run: |
          cmake -B"${{ env.BUILD_DIR }}\clap" -DCMAKE_BUILD_TYPE=Release
          cmake --build "${{ env.BUILD_DIR }}\clap" --config Release

      # the staged paths are relative to BUILD_DIR and match the paths in the
      # windows-binaries artifact configuration, so the signed files extract
      # straight back over the originals
      - name: Stage binaries for signing
        shell: pwsh
        run: |
          $files = @(
            "Release\Standalone Plugin\ShowMIDI.exe",
            "Release\VST\ShowMIDI.dll",
            "Release\VST3\ShowMIDI.vst3\Contents\x86_64-win\ShowMIDI.vst3",
            "Release\LV2 Plugin\ShowMIDI.lv2\ShowMIDI.dll",
            "clap\ShowMIDI_artefacts\Release\ShowMIDI.clap"
          )
          foreach ($file in $files) {
            $source = Join-Path "${{ env.BUILD_DIR }}" $file
            if (!(Test-Path $source)) { throw "$file was not built" }
            $target = Join-Path "staging\binaries" $file
            New-Item -ItemType Directory -Force -Path (Split-Path $target) | Out-Null
            Copy-Item $source $target
          }

      - name: Upload unsigned binaries
        id: unsigned-binaries
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-binaries
          path: staging\binaries

      - name: Sign binaries
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ inputs.signing-policy }}
          artifact-configuration-slug: windows-binaries
          github-artifact-id: ${{ steps.unsigned-binaries.outputs.artifact-id }}
          wait-for-completion: true
          # release-signing needs a human approval, so give it room
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed\binaries

      - name: Put the signed binaries back
        shell: pwsh
        run: Copy-Item -Path "signed\binaries\*" -Destination "${{ env.BUILD_DIR }}" -Recurse -Force

      - name: Build installer
        shell: pwsh
        run: |
          # the runner image ships Inno Setup but documents no path for it
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue)?.Source
          if (!$iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (!(Test-Path $iscc)) { throw "Inno Setup was not found" }
          & $iscc /DPWD="${{ github.workspace }}" /DPATH=./ /DVERSION="${{ inputs.version }}" Installers\ShowMIDI.iss
          if ($LASTEXITCODE -ne 0) { throw "the installer did not build" }

      - name: Upload unsigned installer
        id: unsigned-installer
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-installer
          path: Installers\ShowMIDI-Windows-${{ inputs.version }}.exe

      - name: Sign installer
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ inputs.signing-policy }}
          artifact-configuration-slug: windows-installer
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed\installer

      - name: Checksum
        shell: bash
        run: |
          cd signed/installer
          installer=$(ls ShowMIDI-Windows-*.exe)
          sha256sum "$installer" > "$installer.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            signed\installer\ShowMIDI-Windows-*.exe
            signed\installer\ShowMIDI-Windows-*.exe.sha256

  macos:
    name: macOS package
    if: inputs.platforms == 'all' || inputs.platforms == 'macos'
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: false
          persist-credentials: false

      - name: Check out submodules
        env:
          VST2_SDK_TOKEN: ${{ secrets.VST2_SDK_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${VST2_SDK_TOKEN}@github.com/".insteadOf "https://github.com/"
          git submodule update --init --recursive

      - name: Install Packages
        # the installer is built from a .pkgproj, which needs this third-party
        # tool; it is not part of the runner image
        run: |
          curl -fsSL -o "$RUNNER_TEMP/Packages.dmg" http://s.sudre.free.fr/Software/files/Packages.dmg
          hdiutil attach -quiet -nobrowse -mountpoint "$RUNNER_TEMP/packages" "$RUNNER_TEMP/Packages.dmg"
          pkg=$(find "$RUNNER_TEMP/packages" -maxdepth 1 -name "*.pkg" | head -1)
          test -n "$pkg"
          sudo installer -pkg "$pkg" -target /
          hdiutil detach -quiet "$RUNNER_TEMP/packages"
          test -x /usr/local/bin/packagesbuild

      - name: Import Developer ID certificates
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PWD="$(openssl rand -base64 24)"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certs.p12"
          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          # -A lets any tool use the keys: packagesbuild is third party, so the
          # Apple-only partition list would lock it out of the installer identity
          security import "$RUNNER_TEMP/certs.p12" -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PWD" -A \
            -T /usr/bin/codesign -T /usr/bin/pkgbuild -T /usr/bin/productbuild -T /usr/local/bin/packagesbuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$KEYCHAIN_PWD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed s/\"//g)
          rm "$RUNNER_TEMP/certs.p12"
          echo "identities available to the build:"
          security find-identity -v | sed -n 's/.*"\(Developer ID [^"]*\)".*/  \1/p'
          # the installer project names a keychain by absolute path; point it here
          echo "SIGN_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Store notarization credentials
        env:
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          echo "$NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          xcrun notarytool store-credentials "notary-uwyn.com" \
            --key "$RUNNER_TEMP/notary.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID"
          rm "$RUNNER_TEMP/notary.p8"

      - name: Build, sign, notarize and package
        run: bash -e ./Scripts/build-macos.sh "${{ inputs.version }}"

      - name: Checksum
        run: |
          cd Installers
          zip=$(ls ShowMIDI-macOS-*.zip)
          shasum -a 256 "$zip" > "$zip.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: Installers/ShowMIDI-macOS-*.zip*

  linux:
    name: Linux package
    if: inputs.platforms == 'all' || inputs.platforms == 'linux'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: false
          persist-credentials: false

      - name: Check out submodules
        env:
          VST2_SDK_TOKEN: ${{ secrets.VST2_SDK_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${VST2_SDK_TOKEN}@github.com/".insteadOf "https://github.com/"
          git submodule update --init --recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfreetype6-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev \
            libxi-dev libxrandr-dev libxrender-dev libcurl4-openssl-dev \
            libjack-jackd2-dev ladspa-sdk

      # the script applies the JUCE patches itself before building
      - name: Build and package
        run: bash -e ./Scripts/build-linux.sh "${{ inputs.version }}"

      - name: Checksum
        run: |
          cd Installers
          archive=$(ls ShowMIDI-Linux-*.tar.bz2)
          sha256sum "$archive" > "$archive.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: Installers/ShowMIDI-Linux-*.tar.bz2*
